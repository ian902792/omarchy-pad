# Tokyo Night (Omarchy palette). kitty instead of alacritty for background_image (key cheat sheet).
font_family JetBrainsMono Nerd Font
font_size 11
# pt; extra left/right so text clears the tablet's rounded corners
window_padding_width 6 10
confirm_os_window_close 0
enable_audio_bell no
update_check_interval 0
linux_display_server x11
# remote hosts (the Mac via mosh/ssh) lack xterm-kitty terminfo
term xterm-256color

# generated by bin/omp-watermark (relative to this config dir)
background_image watermark.png
background_image_layout centered

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
# Mac habit (i3 leaves Super+C/V to apps)
map super+c copy_to_clipboard
map super+v paste_from_clipboard

foreground #a9b1d6
background #1a1b26
selection_background #33467c
selection_foreground #c0caf5
cursor #c0caf5
url_color #73daca
color0  #32344a
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #ad8ee6
color6  #449dab
color7  #787c99
color8  #444b6a
color9  #ff7a93
color10 #b9f27c
color11 #ff9e64
color12 #7da6ff
color13 #bb9af7
color14 #0db9d7
color15 #acb0d0
